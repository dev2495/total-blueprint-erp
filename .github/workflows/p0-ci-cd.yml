name: P0 CI/CD

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blueprint_admin
          POSTGRES_PASSWORD: blueprint_pass
          POSTGRES_DB: total_blueprint_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blueprint_admin -d total_blueprint_erp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: "ci-secret-key-0123456789abcdefghijklmnopqrstuvwxyz-erp"
      DB_NAME: total_blueprint_erp
      DB_USER: blueprint_admin
      DB_PASSWORD: blueprint_pass
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      DJANGO_ENV: ci
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Migration safety check
        run: python manage.py makemigrations --check --dry-run
      - name: Show migration plan
        run: python manage.py migrate --plan
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Django checks
        run: python manage.py check
      - name: Django deploy checks
        env:
          DJANGO_ENV: production
          ALLOWED_HOSTS: erp.example.com
          CORS_ALLOWED_ORIGINS: https://erp.example.com
          CSRF_TRUSTED_ORIGINS: https://erp.example.com
          SECURE_SSL_REDIRECT: "True"
          SESSION_COOKIE_SECURE: "True"
          CSRF_COOKIE_SECURE: "True"
          SECURE_HSTS_SECONDS: "31536000"
          DEBUG: "False"
        run: python manage.py check --deploy
      - name: Full backend tests (non-interactive)
        run: python manage.py test --noinput

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend_v2/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (full strict gate)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - backend-quality
      - frontend-quality
    environment: staging
    steps:
      - name: Trigger Render staging deploy hooks
        env:
          HOOK_BACKEND: ${{ secrets.RENDER_STAGING_BACKEND_DEPLOY_HOOK_URL }}
          HOOK_FRONTEND: ${{ secrets.RENDER_STAGING_FRONTEND_DEPLOY_HOOK_URL }}
          HOOK_WORKER: ${{ secrets.RENDER_STAGING_WORKER_DEPLOY_HOOK_URL }}
          HOOK_BEAT: ${{ secrets.RENDER_STAGING_BEAT_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          hooks=("$HOOK_BACKEND" "$HOOK_FRONTEND" "$HOOK_WORKER" "$HOOK_BEAT")
          for hook in "${hooks[@]}"; do
            if [ -n "${hook}" ]; then
              curl -fsS -X POST "${hook}"
            fi
          done

  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - deploy-staging
    environment: production
    steps:
      - name: Trigger Render production deploy hooks
        env:
          HOOK_BACKEND: ${{ secrets.RENDER_PROD_BACKEND_DEPLOY_HOOK_URL }}
          HOOK_FRONTEND: ${{ secrets.RENDER_PROD_FRONTEND_DEPLOY_HOOK_URL }}
          HOOK_WORKER: ${{ secrets.RENDER_PROD_WORKER_DEPLOY_HOOK_URL }}
          HOOK_BEAT: ${{ secrets.RENDER_PROD_BEAT_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          hooks=("$HOOK_BACKEND" "$HOOK_FRONTEND" "$HOOK_WORKER" "$HOOK_BEAT")
          for hook in "${hooks[@]}"; do
            if [ -n "${hook}" ]; then
              curl -fsS -X POST "${hook}"
            fi
          done
