services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    env_file:
      - /opt/tpp-erp/secrets/app.env
    volumes:
      - /opt/tpp-erp/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-bookworm
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - /opt/tpp-erp/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: tpp-erp-backend:production
    build:
      context: /opt/tpp-erp/app
      dockerfile: deploy/aws/Dockerfile.backend
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - /opt/tpp-erp/secrets/app.env
    environment:
      BACKUP_LOCAL_DIR: /var/backups/tpp-erp/managed
      DR_RESTORE_DRILL_COMMAND: /app/deploy/aws/restore-drill.sh
      DR_SMOKE_TEST_COMMAND: /bin/true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /opt/tpp-erp/media:/var/data/media
      - /opt/tpp-erp/logs:/var/log/tpp-erp
      - /opt/tpp-erp/backups:/var/backups/tpp-erp
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    image: tpp-erp-backend:production
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["celery", "-A", "config", "worker", "-l", "INFO", "--concurrency=2"]
    env_file:
      - /opt/tpp-erp/secrets/app.env
    environment:
      BACKUP_LOCAL_DIR: /var/backups/tpp-erp/managed
      DR_RESTORE_DRILL_COMMAND: /app/deploy/aws/restore-drill.sh
      DR_SMOKE_TEST_COMMAND: /bin/true
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - /opt/tpp-erp/media:/var/data/media
      - /opt/tpp-erp/logs:/var/log/tpp-erp
      - /opt/tpp-erp/backups:/var/backups/tpp-erp
    healthcheck:
      disable: true

  beat:
    image: tpp-erp-backend:production
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      [
        "celery",
        "-A",
        "config",
        "beat",
        "-l",
        "INFO",
        "--schedule=/var/log/tpp-erp/celerybeat-schedule",
      ]
    env_file:
      - /opt/tpp-erp/secrets/app.env
    environment:
      BACKUP_LOCAL_DIR: /var/backups/tpp-erp/managed
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - /opt/tpp-erp/media:/var/data/media
      - /opt/tpp-erp/logs:/var/log/tpp-erp
      - /opt/tpp-erp/backups:/var/backups/tpp-erp
    healthcheck:
      disable: true

  frontend:
    image: tpp-erp-frontend:production
    build:
      context: /opt/tpp-erp/app
      dockerfile: deploy/aws/Dockerfile.frontend
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      UI_API_BASE_URL: http://backend:8000
      NEXT_PUBLIC_APP_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      backend:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"

networks:
  default:
    name: tpp-erp-private
