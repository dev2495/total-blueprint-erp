# Total Poly Print ERP host SSH hardening.
# Keep network allow-listing in the AWS/Lightsail firewall so the approved
# administrator CIDR remains an explicit infrastructure decision.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PermitEmptyPasswords no
X11Forwarding no
MaxAuthTries 4
ClientAliveInterval 300
ClientAliveCountMax 2
