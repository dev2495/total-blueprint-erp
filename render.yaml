      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false
      - key: DB_NAME
        fromDatabase:
          name: erp-postgres-staging
          property: database
      - key: DB_USER
        fromDatabase:
          name: erp-postgres-staging
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: erp-postgres-staging
          property: password
      - key: DB_HOST
        fromDatabase:
          name: erp-postgres-staging
          property: host
      - key: DB_PORT
