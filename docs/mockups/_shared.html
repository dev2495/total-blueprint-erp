<!-- Shared boilerplate to copy into each mockup file -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{TITLE}}</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { fontFamily: {
    display: ['Plus Jakarta Sans', 'ui-sans-serif', 'system-ui'],
    sans: ['Inter', 'ui-sans-serif', 'system-ui'],
    mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
  }}}}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  html { scroll-behavior: smooth; }
  body { font-family: Inter, ui-sans-serif, system-ui; background: #f8fafc; color: #0f172a; }
  .display { font-family: 'Plus Jakarta Sans', sans-serif; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .nice-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
  .nice-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
  .nice-scroll { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
  .glassy { backdrop-filter: blur(12px) saturate(140%); -webkit-backdrop-filter: blur(12px) saturate(140%); }
  .lift { transition: transform 180ms ease, box-shadow 180ms ease; }
  .lift:hover { transform: translateY(-1px); box-shadow: 0 10px 25px -10px rgba(2,6,23,.12); }
  .fill-bar { height: 4px; border-radius: 9999px; background: #e2e8f0; overflow: hidden; }
  .fill-bar > i { display: block; height: 100%; background: linear-gradient(90deg, #10b981, #34d399); }
  .donut { transform: rotate(-90deg); }
</style>
</head>
<body class="min-h-screen">
{{CONTENT}}
</body>
</html>
