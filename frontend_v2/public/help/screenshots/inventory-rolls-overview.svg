<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="/inventory/rolls - Overview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef6ff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <rect x="72" y="68" width="1296" height="156" rx="26" fill="#0f172a"/>
  <text x="118" y="132" fill="#ffffff" font-family="Arial, sans-serif" font-size="42" font-weight="800">Inventory Rolls</text>
  <text x="118" y="176" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="22" font-weight="700">Available, reserved, WIP, finished, age, and traceability review</text>
  <g transform="translate(92 266)">
    <rect width="280" height="128" rx="22" fill="url(#card)" stroke="#cbd5e1" stroke-width="2"/>
    <text x="26" y="48" fill="#475569" font-family="Arial, sans-serif" font-size="16" font-weight="700">Available rolls</text>
    <text x="26" y="92" fill="#0f172a" font-family="Arial, sans-serif" font-size="38" font-weight="800">Stock by width</text>
  </g>
  <g transform="translate(404 266)">
    <rect width="280" height="128" rx="22" fill="url(#card)" stroke="#cbd5e1" stroke-width="2"/>
    <text x="26" y="48" fill="#475569" font-family="Arial, sans-serif" font-size="16" font-weight="700">Reservation</text>
    <text x="26" y="92" fill="#0f172a" font-family="Arial, sans-serif" font-size="38" font-weight="800">Planner safe</text>
  </g>
  <g transform="translate(716 266)">
    <rect width="280" height="128" rx="22" fill="url(#card)" stroke="#cbd5e1" stroke-width="2"/>
    <text x="26" y="48" fill="#475569" font-family="Arial, sans-serif" font-size="16" font-weight="700">Ageing</text>
    <text x="26" y="92" fill="#0f172a" font-family="Arial, sans-serif" font-size="38" font-weight="800">Old stock first</text>
  </g>
  <g transform="translate(1028 266)">
    <rect width="280" height="128" rx="22" fill="url(#card)" stroke="#cbd5e1" stroke-width="2"/>
    <text x="26" y="48" fill="#475569" font-family="Arial, sans-serif" font-size="16" font-weight="700">Traceability</text>
    <text x="26" y="92" fill="#0f172a" font-family="Arial, sans-serif" font-size="38" font-weight="800">Source linked</text>
  </g>
  <rect x="92" y="452" width="1256" height="342" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="92" y="452" width="1256" height="64" rx="24" fill="#f8fafc"/>
  <text x="128" y="493" fill="#334155" font-family="Arial, sans-serif" font-size="18" font-weight="800">Roll stock table</text>
  <text x="128" y="562" fill="#64748b" font-family="Arial, sans-serif" font-size="16" font-weight="700">Label</text>
  <text x="360" y="562" fill="#64748b" font-family="Arial, sans-serif" font-size="16" font-weight="700">Material</text>
  <text x="682" y="562" fill="#64748b" font-family="Arial, sans-serif" font-size="16" font-weight="700">Width / Micron</text>
  <text x="940" y="562" fill="#64748b" font-family="Arial, sans-serif" font-size="16" font-weight="700">Status</text>
  <text x="1134" y="562" fill="#64748b" font-family="Arial, sans-serif" font-size="16" font-weight="700">Age</text>
  <g fill="#0f172a" font-family="Arial, sans-serif" font-size="18" font-weight="700">
