    <text x="360" y="626">Clear BOPP</text>
    <text x="682" y="626">820 mm / 18 micron</text>
    <text x="940" y="626">Available</text>
    <text x="1134" y="626">12 days</text>
    <text x="128" y="690">ROLL-002</text>
    <text x="360" y="690">Printed laminate</text>
    <text x="682" y="690">610 mm / 52 micron</text>
    <text x="940" y="690">Reserved</text>
    <text x="1134" y="690">4 days</text>
    <text x="128" y="754">ROLL-003</text>
    <text x="360" y="754">WIP roll</text>
    <text x="682" y="754">1040 mm / 30 micron</text>
    <text x="940" y="754">WIP</text>
    <text x="1134" y="754">1 day</text>
